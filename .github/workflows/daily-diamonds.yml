name: CoinMarketCap Daily Diamonds Auto-Claimer

on:
  workflow_dispatch: # Uruchamiane wyłącznie przez cron-job.org (API dispatch) lub ręcznie w zakładce "Actions"

concurrency:
  group: coinmarketcap-diamonds
  cancel-in-progress: false

jobs:
  claim-diamonds:
    name: Odbierz codzienne diamenty
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: 🌐 Konfiguracja Cloudflare WARP (czyste IP)
        uses: fscarmen/warp-on-actions@v1.4
        with:
          mode: client
          stack: ipv4

      - name: 🔍 Sprawdzenie adresu IP
        run: curl -s https://cloudflare.com/cdn-cgi/trace

      - name: 🐍 Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎁 Uruchomienie skryptu odbioru nagród krypto (CoinGecko & CoinMarketCap)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CMC_AUTH_TOKEN: ${{ secrets.CMC_AUTH_TOKEN }}
          COINGECKO_COOKIE: ${{ secrets.COINGECKO_COOKIE }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
